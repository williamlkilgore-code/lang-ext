<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>

  <!-- Persian letter 'ع' (Ayn) representing roots -->
  <text x="64" y="85" font-family="Arial" font-size="64" font-weight="bold" fill="white" text-anchor="middle">ع</text>

  <!-- Decorative underline -->
  <line x1="30" y1="95" x2="98" y2="95" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
