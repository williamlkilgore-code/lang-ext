<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farsi Root Word Learner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>Farsi Root Word Learner</h1>
      <p class="subtitle">Discover Arabic roots in Persian text</p>
    </header>

    <main class="popup-main">
      <section class="stats-section">
        <h2>Dictionary Stats</h2>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-value" id="totalRoots">-</div>
            <div class="stat-label">Roots</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="totalWords">-</div>
            <div class="stat-label">Words</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="totalCategories">-</div>
            <div class="stat-label">Categories</div>
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h2>Settings</h2>

        <div class="setting-item">
          <label class="toggle-label">
            <input type="checkbox" id="enableExtension" checked>
            <span class="toggle-slider"></span>
            <span class="setting-text">Enable highlighting</span>
          </label>
        </div>

        <div class="setting-item">
          <label class="toggle-label">
            <input type="checkbox" id="autoDetect" checked>
            <span class="toggle-slider"></span>
            <span class="setting-text">Auto-detect Persian pages</span>
          </label>
        </div>

        <div class="setting-item">
          <label for="highlightColor">Highlight color</label>
          <select id="highlightColor">
            <option value="indigo">Indigo (Default)</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="purple">Purple</option>
            <option value="red">Red</option>
          </select>
        </div>
      </section>

      <section class="info-section">
        <h2>About</h2>
        <p>This extension helps you learn Persian/Farsi by identifying Arabic root words and their derivatives in context.</p>

        <div class="links">
          <a href="#" id="viewDictionary" class="link-button">View Dictionary</a>
          <a href="#" id="reportIssue" class="link-button">Report Issue</a>
        </div>
      </section>
    </main>

    <footer class="popup-footer">
      <p>Version <span id="version">1.0.0</span></p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
